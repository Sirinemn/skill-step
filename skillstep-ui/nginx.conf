server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip pour les performances
    gzip on;
    gzip_types text/plain text/css application/json
               application/javascript text/xml
               application/xml image/svg+xml;

    # Cache long pour les assets hashés (Angular les nomme avec un hash)
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing — toutes les routes vers index.html
    # Sans ça, /dashboard retourne 404 au refresh
    location / {
        try_files $uri $uri/ /index.html;
    }
}