<div class="flex min-h-screen bg-bg-base dark:bg-gray-950">

      <!-- ── Sidebar desktop (cachée sur mobile) ── -->
      <div class="hidden md:block">
        <app-sidebar></app-sidebar>
      </div>

      <!-- ── Contenu principal ── -->
      <main class="flex-1 min-w-0 overflow-y-auto">

        <!-- Topbar mobile uniquement -->
        <div class="md:hidden flex items-center justify-between
                    px-4 py-3 sticky top-0 z-40
                    bg-bg-surface  dark:bg-gray-900
                    border-b border-border-soft dark:border-gray-800">

          <!-- Logo mobile -->
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-lg bg-primary-500
                        flex items-center justify-center
                        text-white text-sm font-bold">
              S
            </div>
            <span class="font-bold text-text-heading dark:text-gray-100">
              Skill-Step
            </span>
          </div>

          <!-- Bouton hamburger -->
          <button
            (click)="sidebarOpen = !sidebarOpen"
            class="p-2 rounded-lg text-text-muted
                   hover:bg-bg-hover dark:hover:bg-gray-800
                   dark:text-gray-400">
            ☰
          </button>
        </div>

        <!-- Sidebar mobile — drawer qui s'ouvre par-dessus -->
        <div *ngIf="sidebarOpen"
             class="md:hidden fixed inset-0 z-50 flex">

          <!-- Overlay sombre cliquable -->
          <div class="absolute inset-0 bg-black bg-opacity-50"
               (click)="sidebarOpen = false">
          </div>

          <!-- Drawer sidebar -->
          <div class="relative z-10" (click)="sidebarOpen = false">
            <app-sidebar></app-sidebar>
          </div>

        </div>

        <!-- Contenu de la page courante -->
        <router-outlet></router-outlet>

      </main>
    </div>
