<div class="min-h-screen bg-bg-base flex flex-col">

  <app-navbar></app-navbar>

  <!-- Carte de connexion centrée -->
  <main class="flex-1 flex items-center justify-center bg-gradient-hero py-16">
    <div class="card max-w-md w-full mx-4 text-center shadow-card-hover">

      <!-- Logo -->
      <div class="w-16 h-16 rounded-2xl bg-primary-500
                  flex items-center justify-center
                  text-3xl mx-auto mb-6">
        🚀
      </div>

      <h2 class="font-bold text-text-heading mb-2">
        Bon retour parmi nous !
      </h2>
      <p class="text-text-muted text-sm mb-8">
        Connectez-vous pour accéder à votre journal d'apprentissage
      </p>

      <!-- Bouton Google -->
      <button
        (click)="onLoginWithGoogle()"
        class="w-full btn-primary justify-center gap-3 py-4 mb-4">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92
                   c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57
                   c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#fff" opacity=".9"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77
                   c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93
                   -6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#fff" opacity=".9"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43
                   .35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43
                   3.45 1.18 4.93l3.66-2.84z" fill="#fff" opacity=".9"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15
                   C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18
                   7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                fill="#fff" opacity=".9"/>
        </svg>
        Continuer avec Google
      </button>

      <p class="text-xs text-text-muted">
        En vous connectant, vous acceptez nos
        <a href="#" class="text-primary-500 hover:underline">conditions d'utilisation</a>
      </p>

      <div class="mt-6 pt-6 border-t border-border-soft">
        <a routerLink="/auth" class="text-sm text-text-muted hover:text-primary-500
                                     transition-colors">
          ← Retour à l'accueil
        </a>
      </div>

    </div>
  </main>

  <app-footer></app-footer>

</div>
