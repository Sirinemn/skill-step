<!-- Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4
            bg-black bg-opacity-50 animate-fade-in">

  <!-- Modale -->
  <div class="w-full max-w-sm rounded-2xl shadow-2xl
              bg-bg-surface dark:bg-gray-800
              border border-border-card dark:border-gray-700
              animate-fade-up p-6">

    <!-- Icône + Titre -->
    <div class="flex items-start gap-4 mb-4">

      <div class="w-10 h-10 rounded-xl shrink-0
                  flex items-center justify-center text-xl"
           [class.bg-red-100]="danger"
           [class.dark:bg-red-950]="danger"
           [class.bg-primary-50]="!danger"
           [class.dark:bg-primary-950]="!danger">
        {{ danger ? '🗑️' : '❓' }}
      </div>

      <div class="flex-1">
        <h3 class="font-bold text-base text-text-heading dark:text-gray-100">
          {{ title }}
        </h3>
        <p class="text-text-muted dark:text-gray-400 text-sm mt-1 leading-relaxed">
          {{ message }}
        </p>
      </div>

    </div>

    <!-- Actions -->
    <div class="flex gap-3 justify-end mt-6">

      <button
        (click)="cancelled.emit()"
        class="btn-secondary text-sm px-5 py-2.5">
        {{ cancelLabel }}
      </button>

      <button
        (click)="confirmed.emit()"
        class="text-sm px-5 py-2.5 rounded-xl font-semibold
               transition-all duration-200 cursor-pointer"
        [class.bg-red-500]="danger"
        [class.hover:bg-red-600]="danger"
        [class.text-white]="danger"
        [class.btn-primary]="!danger">
        {{ confirmLabel }}
      </button>

    </div>

  </div>
</div>
