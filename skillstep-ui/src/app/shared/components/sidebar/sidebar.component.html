<aside class="w-44 min-h-screen bg-bg-surface border-r border-border-soft
              flex flex-col py-5 px-3 shrink-0">

  <!-- Logo -->
  <div class="flex items-center gap-2 px-3 mb-8">
    <span class="text-2xl">🚀</span>
    <span class="font-bold text-text-heading text-base">Skill-Step</span>
  </div>

  <!-- Navigation -->
  <nav class="flex flex-col gap-1 flex-1">
    <a
    
      *ngFor="let item of navItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      class="nav-item">
      <span class="text-base leading-none">{{ item.icon }}</span>
      <span>{{ item.label }}</span>
    </a>
  </nav>

    <!-- ─── Zone bas ──────────────────────────── -->
  <div class="border-t border-border-soft dark:border-gray-800 pt-4 mt-4
              flex flex-col gap-2">

    <!-- Toggle Dark / Light -->
    <div class="flex items-center justify-between px-3 py-1">

      <!-- Label avec icône qui change -->
      <span class="text-xs text-text-muted select-none">
        {{ isDark$() ? '🌙 Sombre' : '☀️ Clair' }}
      </span>

      <!-- Switch animé -->
      <button
        (click)="toggleTheme()"
        [attr.aria-label]="isDark$() ? 'Passer en mode clair' : 'Passer en mode sombre'"
        class="relative w-10 h-5 rounded-full
               focus:outline-none focus:ring-2 focus:ring-primary-500
               focus:ring-offset-1 transition-colors duration-300"
        [class.bg-primary-500]="isDark$()"
        [class.bg-gray-300]="!isDark$()">

        <!-- Pastille blanche qui glisse -->
        <span
          class="absolute top-0.5 w-4 h-4 bg-white rounded-full
                 shadow-sm transition-all duration-300 ease-in-out"
          [class.left-0.5]="!isDark$()"
          [class.left-5]="isDark$()">
        </span>

      </button>
    </div>

    <!-- Avatar + nom utilisateur -->
    <div class="flex items-center gap-2 px-3 py-1" *ngIf="user$()">
      <img
        *ngIf="user$()?.avatarUrl; else initials"
        [src]="user$()!.avatarUrl!"
        [alt]="displayName$()"
        class="w-7 h-7 rounded-full object-cover"
      />
      <ng-template #initials>
        <div class="w-7 h-7 rounded-full bg-primary-100
                    flex items-center justify-center
                    text-primary-500 text-xs font-bold">
          {{ displayName$().charAt(0).toUpperCase() }}
        </div>
      </ng-template>
      <span class="text-xs text-text-muted truncate max-w-24">
        {{ displayName$() }}
      </span>
    </div>

    <!-- Déconnexion -->
    <button
      (click)="onLogout()"
      class="nav-item w-full text-red-500
             hover:bg-red-50 hover:text-red-600
             dark:hover:bg-red-950 dark:text-red-400">
      <span>🚪</span>
      <span>Déconnexion</span>
    </button>

  </div>
</aside>
