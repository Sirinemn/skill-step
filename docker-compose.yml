services:

  postgres:
    image: postgres:16-alpine
    container_name: skillstep_postgres
    environment:
      POSTGRES_DB:       skillstep_db
      POSTGRES_USER:     ${DB_USERNAME:-skillstep}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-skillstep}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillstep"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: skillstep_adminer
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

