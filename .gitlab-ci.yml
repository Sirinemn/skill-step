stages:
  - build
  - test
  - build-front
  - test-front

variables:
  MAVEN_OPTS:     "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end"
  SPRING_PROFILES_ACTIVE: "test"
  BUILD_DIR:      "skillstep-api"
  FRONT_DIR:      "skillstep-ui"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/
    - $FRONT_DIR/node_modules/

# ════════════════════════════════
# BACKEND
# ════════════════════════════════
backend-build:
  stage: build
  image: maven:3.9-eclipse-temurin-17 
  script:
    - cd $BUILD_DIR && mvn $MAVEN_CLI_OPTS compile
  only:
    - merge_requests
    - main
    - develop

backend-test:
  stage: test
  image: maven:3.9-eclipse-temurin-17 
  script:
    - cd $BUILD_DIR && mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    reports:
      junit: $BUILD_DIR/target/surefire-reports/TEST-*.xml
    paths:
      - $BUILD_DIR/target/surefire-reports/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - develop

# ════════════════════════════════
# FRONTEND
# ════════════════════════════════
frontend-build:
  stage: build-front
  image: node:20-alpine
  script:
    - cd $FRONT_DIR
    - npm ci
    - npm run build
  artifacts:
    paths:
      - $FRONT_DIR/dist/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - develop

frontend-test:
  stage: test-front
  image: node:20-alpine
  script:
    - cd $FRONT_DIR
    - npm ci
    - npm test -- --watchAll=false --coverage
  artifacts:
    when: always
    reports:
      junit: $FRONT_DIR/coverage/junit.xml
    paths:
      - $FRONT_DIR/coverage/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - develop