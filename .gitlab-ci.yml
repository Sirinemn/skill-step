image: maven:3.9-eclipse-temurin-17

stages:
  - build
  - test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end"
  SPRING_PROFILES_ACTIVE: "test"
  # ↓ le sous-dossier contenant le pom.xml
  BUILD_DIR: "skillstep-api"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/

build:
  stage: build
  script:
    - cd $BUILD_DIR && mvn $MAVEN_CLI_OPTS compile
  only:
    - merge_requests
    - main
    - develop

test:
  stage: test
  script:
    - cd $BUILD_DIR && mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    reports:
      junit: $BUILD_DIR/target/surefire-reports/TEST-*.xml
    paths:
      - $BUILD_DIR/target/surefire-reports/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - develop